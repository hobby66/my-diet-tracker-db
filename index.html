<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, getDoc, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Your specific Firebase configuration has been added here.
    const firebaseConfig = {
        apiKey: "AIzaSyBHzCIwUR5ncIA8-Hx9nNYbIu4V2EffZVQ",
        authDomain: "my-diet-tracker-db.firebaseapp.com",
        projectId: "my-diet-tracker-db",
        storageBucket: "my-diet-tracker-db.appspot.com",
        messagingSenderId: "564828202506",
        appId: "1:564828202506:web:caa54e9668d6a4f62ca1f3",
        measurementId: "G-4JQRXJWPEG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userId;
    let unsubscribeData;
    let isLoginMode = true;

    const loadingOverlay = document.getElementById('loading-overlay');
    const authOverlay = document.getElementById('auth-overlay');
    const appContent = document.getElementById('app-content');
    const authForm = document.getElementById('auth-form');
    const authTitle = document.getElementById('auth-title');
    const authToggleBtn = document.getElementById('auth-toggle');
    const authSubmitBtn = document.getElementById('auth-submit');
    const authEmailInput = document.getElementById('auth-email');
    const authPasswordInput = document.getElementById('auth-password');
    const authErrorEl = document.getElementById('auth-error');
    const signOutBtn = document.getElementById('sign-out-btn');
    const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--color-primary').trim();

    onAuthStateChanged(auth, user => {
        loadingOverlay.classList.add('hidden');
        if (user) {
            userId = user.uid;
            appContent.classList.remove('hidden');
            authOverlay.classList.add('hidden');
            initializeAppLogic();
        } else {
            appContent.classList.add('hidden');
            authOverlay.classList.remove('hidden');
            if (unsubscribeData) {
                unsubscribeData();
            }
        }
    });

    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = authEmailInput.value;
        const password = authPasswordInput.value;
        authErrorEl.textContent = '';

        if (isLoginMode) {
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                authErrorEl.textContent = 'Login failed. Check your email and password.';
                console.error("Login error:", error);
            }
        } else {
            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                authErrorEl.textContent = 'Sign up failed: ' + error.message;
                console.error("Sign up error:", error);
            }
        }
    });

    authToggleBtn.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        authTitle.textContent = isLoginMode ? 'Log In' : 'Sign Up';
        authSubmitBtn.textContent = isLoginMode ? 'Log In' : 'Sign Up';
        authToggleBtn.textContent = isLoginMode ? "Don't have an account? Sign Up" : "Already have an account? Log In";
        authForm.reset();
        authErrorEl.textContent = '';
    });

    signOutBtn.addEventListener('click', async () => {
        await signOut(auth);
    });

    function initializeAppLogic() {
        const dateInput = document.getElementById('current-date');
        const mealContainer = document.getElementById('meal-container');
        const workoutForm = document.getElementById('workout-form');
        const workoutList = document.getElementById('workout-list');
        const workoutPlaceholder = document.getElementById('workout-placeholder'); // <-- ADDED THIS FIX
        const addMealBtn = document.getElementById('add-meal-btn');
        const addMealModal = document.getElementById('add-meal-modal');
        const cancelAddMealBtn = document.getElementById('cancel-add-meal');
        const confirmAddMealBtn = document.getElementById('confirm-add-meal');
        const mealNameInput = document.getElementById('meal-name-input');
        const prevDayBtn = document.getElementById('prev-day');
        const nextDayBtn = document.getElementById('next-day');
        const bmrInput = document.getElementById('bmr-input');
        
        // Monthly Summary Elements
        const monthSelect = document.getElementById('month-select');
        const yearSelect = document.getElementById('year-select');
        const monthlyNetEl = document.getElementById('monthly-net-calories');
        const monthlyStatusLabelEl = document.getElementById('monthly-status-label');


        let weeklyChartInstance = null;
        let macroChartInstance = null;
        const today = new Date();
        const defaultYear = new Date().getFullYear(); 

        let state = { 
            currentDate: today.toISOString().split('T')[0], 
            selectedMonth: today.getMonth(), // 0-indexed
            selectedYear: defaultYear,
            bmr: 1232, // Will be loaded from settings
            meals: {},
            workouts: {}
        };

        const defaultMeals = ['Breakfast', 'Lunch', 'Dinner'];

        function initializeSelectors() {
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            monthNames.forEach((name, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = name;
                if (index === state.selectedMonth) { option.selected = true; }
                monthSelect.appendChild(option);
            });

            const currentYear = new Date().getFullYear();
            const years = [currentYear - 1, currentYear, currentYear + 1]; 
            
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === state.selectedYear) { 
                    option.selected = true;
                }
                yearSelect.appendChild(option);
            });
        }
        
        initializeSelectors();
        dateInput.value = state.currentDate;
        loadDataAndListen(state.currentDate);

        /* --- Utility Functions for Charts --- */

        /** Converts a date string (YYYY-MM-DD) to a Date object. */
        function parseDate(dateStr) {
            // Note: Use Date.UTC to prevent timezone issues when calculating days.
            const parts = dateStr.split('-').map(Number);
            return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
        }

        /** Gets the start of the week (Sunday) for a given date string (YYYY-MM-DD). */
        function getStartOfWeek(dateStr) {
            const date = parseDate(dateStr);
            const day = date.getUTCDay(); // 0 for Sunday
            date.setUTCDate(date.getUTCDate() - day);
            return date.toISOString().split('T')[0];
        }

        /** Returns an array of date strings (YYYY-MM-DD) for the 7 days of the week starting from Sunday. */
        function getDatesInWeek(startOfWeekStr) {
            const dates = [];
            let currentDate = parseDate(startOfWeekStr);
            for (let i = 0; i < 7; i++) {
                dates.push(currentDate.toISOString().split('T')[0].substring(0, 10));
                currentDate.setUTCDate(currentDate.getUTCDate() + 1);
            }
            return dates;
        }

        /** Returns an array of date strings for all days in a given month/year. */
        function getDaysInMonth(year, month) {
            const dateStrings = [];
            // Month is 0-indexed for Date object, but we want 1-based day counting
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(Date.UTC(year, month, day));
                // Format: YYYY-MM-DD
                dateStrings.push(date.toISOString().split('T')[0].substring(0, 10));
            }
            return dateStrings;
        }

        /** Calculates daily summary (calsIn, calsOut, macros) from raw data. */
        function calculateDailySummary(data, bmr) {
            let totalCalsIn = 0, totalProtein = 0, totalCarbs = 0, totalFat = 0;
            let totalCalsOut = bmr;

            // Meals
            if (data.meals) {
                Object.values(data.meals).flat().forEach(item => {
                    totalCalsIn += Number(item.calories) || 0;
                    totalProtein += Number(item.protein) || 0;
                    totalCarbs += Number(item.carbs) || 0;
                    totalFat += Number(item.fat) || 0;
                });
            }
            
            // Workouts
            if (data.workouts) {
                Object.values(data.workouts).forEach(workout => {
                    totalCalsOut += Number(workout.calories) || 0;
                });
            }
            
            return {
                netCalories: totalCalsIn - totalCalsOut,
                calsIn: totalCalsIn,
                calsOut: totalCalsOut,
                protein: totalProtein,
                carbs: totalCarbs,
                fat: totalFat
            };
        }

        /* --- Primary Data Fetching --- */

        /** Fetches all daily data documents in a given time range (currently set for month-based querying). */
        async function fetchAllDailyData() {
            if (!userId) return {};
            
            // We'll fetch all data for the selected month to cover both weekly and monthly views
            const { selectedYear, selectedMonth } = state;
            const datesInMonth = getDaysInMonth(selectedYear, selectedMonth);
            const dataPromises = datesInMonth.map(dateStr => {
                const docRef = doc(db, 'users', userId, 'dates', dateStr);
                return getDoc(docRef).then(snap => ({ date: dateStr, data: snap.data() || {} }));
            });

            const results = await Promise.all(dataPromises);
            const allDailyData = {};
            
            results.forEach(res => {
                // Pre-calculate summary for easy access
                allDailyData[res.date] = calculateDailySummary(res.data, state.bmr);
            });
            
            return allDailyData;
        }


        /* --- Data Management & Rendering --- */

        async function loadDataAndListen(date) {
            if (unsubscribeData) unsubscribeData();

            const settingsRef = doc(db, 'users', userId);
            const settingsSnap = await getDoc(settingsRef);
            const settingsData = settingsSnap.data() || {};
            state.bmr = settingsData.bmr || 1232; 

            const dataRef = doc(db, 'users', userId, 'dates', date);
            unsubscribeData = onSnapshot(dataRef, (docSnap) => {
                const data = docSnap.data() || {};
                state.meals = data.meals || {};
                state.workouts = data.workouts || {};
                if (Object.keys(state.meals).length === 0) {
                    state.meals = {};
                    defaultMeals.forEach(mealName => { state.meals[mealName] = []; });
                    // Save default meals back to DB if starting fresh
                    saveData();
                }
                render();
            });
            
            // Re-render charts whenever the BMR or the date changes, as they rely on BMR
            bmrInput.removeEventListener('change', saveBMR);
            bmrInput.addEventListener('change', async () => {
                await saveBMR();
                renderChartsAndSummaryBar(); // Rerender charts after BMR changes
            });
        }

        async function saveData() {
            const docRef = doc(db, 'users', userId, 'dates', state.currentDate);
            await setDoc(docRef, {
                meals: state.meals,
                workouts: state.workouts
            }, { merge: true });
            // The onSnapshot listener handles the render() call after save
        }

        async function saveBMR() {
            const settingsRef = doc(db, 'users', userId);
            const newBMR = parseInt(bmrInput.value) || 0;
            if (newBMR !== state.bmr) {
                state.bmr = newBMR;
                await setDoc(settingsRef, { bmr: state.bmr }, { merge: true });
            }
        }

        function render() {
            dateInput.value = state.currentDate;
            bmrInput.value = state.bmr;
            renderMeals();
            renderWorkouts();
            updateSummary();
            // Call this on every render() as daily data changes affect weekly/monthly calculations
            renderChartsAndSummaryBar(); 
        }

        // Dedicated function to call all charting/summary bar renders
        async function renderChartsAndSummaryBar() {
            const allDailyData = await fetchAllDailyData(); // Fetch once for all charts
            renderWeeklyChart(allDailyData);
            renderMacroChart(allDailyData);
            renderMonthlySummaryBar(allDailyData);
        }

        function renderMeals() {
            mealContainer.innerHTML = '';
            Object.keys(state.meals).sort((a,b) => {
                const order = ['Breakfast', 'Lunch', 'Dinner'];
                return (order.indexOf(a) === -1 ? 99 : order.indexOf(a)) - (order.indexOf(b) === -1 ? 99 : order.indexOf(b));
            }).forEach(mealName => {
                const mealItems = state.meals[mealName] || [];
                const card = document.createElement('div');
                card.className = 'card p-4 space-y-3'; 
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-xl font-bold text-gray-800">${mealName}</h2>
                        <button class="remove-meal-section-btn text-red-500 hover:text-red-700 p-1 rounded-full bg-red-100" data-meal-name="${mealName}" title="Delete Meal Section">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                    
                    <div class="meal-list space-y-2 border-t border-gray-200 pt-3">
                        ${mealItems.length === 0 ? `<p class="text-sm text-gray-500">No items logged yet for ${mealName}.</p>` : mealItems.map((item, index) => `
                            <div class="flex justify-between items-start p-2 rounded-md bg-gray-50">
                                <div>
                                    <p class="font-semibold text-gray-800">${item.food}</p>
                                    <p class="text-xs text-gray-500 mt-1">
                                        Cal: ${item.calories || 0} | P: ${item.protein || 0}g | C: ${item.carbs || 0}g | F: ${item.fat || 0}g
                                    </p>
                                </div>
                                <button class="remove-meal-item-btn text-red-400 hover:text-red-600 ml-4 p-1 rounded-full" data-meal-name="${mealName}" data-index="${index}" title="Remove Item">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        `).join('')}
                    </div>

                    <h4 class="text-lg font-semibold mt-4 mb-2 text-gray-700 border-t border-gray-200 pt-3">Add New Item</h4>
                    <form class="meal-form space-y-3" data-meal-name="${mealName}">
                        <input type="text" name="food" placeholder="Food Item (e.g., Apple)" class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus-ring-primary" required>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            <div><input type="number" step="any" name="calories" placeholder="Calories *" class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus-ring-primary" required></div>
                            <div><input type="number" step="any" name="protein" placeholder="Protein (g)" class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus-ring-primary"></div>
                            <div><input type="number" step="any" name="carbs" placeholder="Carbs (g)" class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus-ring-primary"></div>
                            <div><input type="number" step="any" name="fat" placeholder="Fat (g)" class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus-ring-primary"></div>
                            <div><input type="number" step="any" name="sugar" placeholder="Sugar (g)" class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus-ring-primary"></div>
                            <div><input type="number" step="any" name="fiber" placeholder="Fiber (g)" class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus-ring-primary"></div>
                        </div>
                        <button type="submit" class="w-full bg-blue-500 text-white font-bold py-2 px-3 rounded-lg hover:bg-blue-600 transition duration-300 mt-3">Log Item</button>
                    </form>
                `;
                mealContainer.appendChild(card);
            });
        }

        function renderWorkouts() {
            const workouts = Object.values(state.workouts);
            workoutList.innerHTML = '';
            // workoutPlaceholder is now guaranteed to exist from initializeAppLogic

            if (workouts.length === 0) {
                workoutPlaceholder.style.display = 'block';
            } else {
                workoutPlaceholder.style.display = 'none';
                Object.keys(state.workouts).forEach((id) => {
                    const workout = state.workouts[id];
                    const workoutEl = document.createElement('div');
                    workoutEl.className = 'flex justify-between items-center p-2 rounded-md bg-red-50 border border-red-100';
                    workoutEl.innerHTML = `
                        <div>
                            <p class="font-semibold">${workout.type}</p>
                            <p class="text-xs text-gray-500">${workout.calories} calories burned</p>
                        </div>
                        <button class="remove-workout-btn text-red-400 hover:text-red-600 ml-4 p-1 rounded-full" data-id="${id}" title="Remove Workout">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                        `;
                    workoutList.appendChild(workoutEl);
                });
            }
        }

        function updateSummary() {
            let totalCalsIn = 0, totalProtein = 0, totalCarbs = 0, totalFat = 0, totalSugar = 0, totalFiber = 0;
            Object.values(state.meals).flat().forEach(item => {
                totalCalsIn += Number(item.calories) || 0;
                totalProtein += Number(item.protein) || 0;
                totalCarbs += Number(item.carbs) || 0;
                totalFat += Number(item.fat) || 0;
                totalSugar += Number(item.sugar) || 0;
                totalFiber += Number(item.fiber) || 0;
            });
            const bmr = Number(state.bmr) || 0;
            let totalCalsOut = bmr;
            Object.values(state.workouts).forEach(workout => { totalCalsOut += Number(workout.calories) || 0; });
            const net = totalCalsIn - totalCalsOut;

            document.getElementById('total-calories-in').textContent = totalCalsIn;
            document.getElementById('total-calories-out').textContent = totalCalsOut;
            document.getElementById('net-calories').textContent = net;

            const statusEl = document.getElementById('calorie-status');
            statusEl.classList.remove('text-green-600', 'text-red-600', 'text-gray-600');
            statusEl.classList.remove('bg-green-100', 'bg-red-100', 'bg-gray-100');
            statusEl.classList.add('px-3', 'py-1', 'rounded-full');

            if (net > 50) {
                statusEl.textContent = 'SURPLUS';
                statusEl.classList.add('text-red-600', 'bg-red-100');
            } else if (net < -50) {
                statusEl.textContent = 'DEFICIT';
                statusEl.classList.add('text-green-600', 'bg-green-100');
            } else {
                statusEl.textContent = 'MAINTAIN';
                statusEl.classList.add('text-gray-600', 'bg-gray-100');
            }

            document.getElementById('total-protein').textContent = `${totalProtein.toFixed(0)} g`;
            document.getElementById('total-carbs').textContent = `${totalCarbs.toFixed(0)} g`;
            document.getElementById('total-fat').textContent = `${totalFat.toFixed(0)} g`;
            document.getElementById('total-sugar').textContent = `${totalSugar.toFixed(0)} g`;
            document.getElementById('total-fiber').textContent = `${totalFiber.toFixed(0)} g`;
        }

        /* --- Chart Rendering Functions --- */

        function renderWeeklyChart(allDailyData) {
            if (weeklyChartInstance) {
                weeklyChartInstance.destroy();
            }

            const startOfWeek = getStartOfWeek(state.currentDate);
            const weekDates = getDatesInWeek(startOfWeek); // YYYY-MM-DD format
            const weekLabels = weekDates.map(date => {
                const day = new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
                const dayNum = new Date(date + 'T00:00:00').getDate();
                return `${day} ${dayNum}`;
            });
            
            const netCaloriesData = weekDates.map(date => {
                const dayData = allDailyData[date];
                return dayData ? dayData.netCalories : 0;
            });
            
            const ctx = document.getElementById('weekly-chart').getContext('2d');
            weeklyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: weekLabels,
                    datasets: [{
                        label: 'Net Calories',
                        data: netCaloriesData,
                        backgroundColor: netCaloriesData.map(net => net > 0 ? 'rgba(239, 68, 68, 0.8)' : 'rgba(16, 185, 129, 0.8)'), // Red for Surplus, Green for Deficit
                        borderColor: netCaloriesData.map(net => net > 0 ? 'rgba(239, 68, 68, 1)' : 'rgba(16, 185, 129, 1)'),
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: { display: true, text: 'Net Calories (Cal)' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false }
                    }
                }
            });
        }

        function renderMacroChart(allDailyData) {
            if (macroChartInstance) {
                macroChartInstance.destroy();
            }

            const startOfWeek = getStartOfWeek(state.currentDate);
            const weekDates = getDatesInWeek(startOfWeek);
            const weekLabels = weekDates.map(date => new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' }));
            
            const proteinData = weekDates.map(date => allDailyData[date]?.protein || 0);
            const carbsData = weekDates.map(date => allDailyData[date]?.carbs || 0);
            const fatData = weekDates.map(date => allDailyData[date]?.fat || 0);
            
            const ctx = document.getElementById('macro-chart').getContext('2d');
            macroChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: weekLabels,
                    datasets: [
                        {
                            label: 'Protein (g)',
                            data: proteinData,
                            borderColor: primaryColor,
                            backgroundColor: 'rgba(59, 130, 246, 0.2)', // Blue
                            tension: 0.3
                        },
                        {
                            label: 'Carbs (g)',
                            data: carbsData,
                            borderColor: '#f59e0b', // Amber-500
                            backgroundColor: 'rgba(245, 158, 11, 0.2)',
                            tension: 0.3
                        },
                        {
                            label: 'Fat (g)',
                            data: fatData,
                            borderColor: '#10b981', // Emerald-500
                            backgroundColor: 'rgba(16, 185, 129, 0.2)',
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Grams (g)' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { mode: 'index', intersect: false }
                    }
                }
            });
        }

        function renderMonthlySummaryBar(allDailyData) {
            const { selectedYear, selectedMonth } = state;
            
            // Filter the fetched data to only include the selected month
            const datesInMonth = getDaysInMonth(selectedYear, selectedMonth);
            let totalMonthlyNet = 0;
            let daysWithData = 0;

            datesInMonth.forEach(dateStr => {
                const dayData = allDailyData[dateStr];
                if (dayData) {
                    totalMonthlyNet += dayData.netCalories;
                    daysWithData++;
                }
            });

            // Update the display elements
            monthlyNetEl.textContent = totalMonthlyNet.toFixed(0);
            monthlyStatusLabelEl.textContent = `Total Calorie Balance for ${new Date(selectedYear, selectedMonth, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })} (${daysWithData} days logged)`;

            // Update color/status based on monthly net
            monthlyNetEl.classList.remove('text-green-600', 'text-red-600', 'text-gray-800');
            if (totalMonthlyNet > 50 * daysInMonth.length) { // Arbitrary large surplus threshold
                monthlyNetEl.classList.add('text-red-600');
            } else if (totalMonthlyNet < -50 * daysInMonth.length) { // Arbitrary large deficit threshold
                monthlyNetEl.classList.add('text-green-600');
            } else {
                monthlyNetEl.classList.add('text-gray-800');
            }
        }
        
        /* --- Event Listeners --- */

        // Daily Navigation
        dateInput.addEventListener('change', (e) => {
            state.currentDate = e.target.value;
            loadDataAndListen(state.currentDate);
        });

        prevDayBtn.addEventListener('click', () => {
            const current = parseDate(state.currentDate);
            current.setUTCDate(current.getUTCDate() - 1);
            state.currentDate = current.toISOString().split('T')[0].substring(0, 10);
            loadDataAndListen(state.currentDate);
        });

        nextDayBtn.addEventListener('click', () => {
            const current = parseDate(state.currentDate);
            current.setUTCDate(current.getUTCDate() + 1);
            state.currentDate = current.toISOString().split('T')[0].substring(0, 10);
            loadDataAndListen(state.currentDate);
        });

        // Monthly Selectors
        monthSelect.addEventListener('change', (e) => {
            state.selectedMonth = parseInt(e.target.value);
            renderChartsAndSummaryBar();
        });

        yearSelect.addEventListener('change', (e) => {
            state.selectedYear = parseInt(e.target.value);
            renderChartsAndSummaryBar();
        });

        // Workout Logic
        workoutForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('workout-type').value;
            const calories = parseInt(document.getElementById('calories-burned').value);
            
            const id = Date.now().toString();
            state.workouts[id] = { type, calories };

            document.getElementById('workout-type').value = '';
            document.getElementById('calories-burned').value = '';

            await saveData();
        });

        workoutList.addEventListener('click', async (e) => {
            if (e.target.closest('.remove-workout-btn')) {
                const button = e.target.closest('.remove-workout-btn');
                const id = button.dataset.id;
                delete state.workouts[id];
                await saveData();
            }
        });

        // Meal Item Logic (Delegated)
        mealContainer.addEventListener('submit', async (e) => {
            if (e.target.classList.contains('meal-form')) {
                e.preventDefault();
                const mealName = e.target.dataset.mealName;
                const formData = new FormData(e.target);
                const newItem = {};
                for (let [name, value] of formData.entries()) {
                    newItem[name] = Number(value) || value; // Parse numbers, keep strings (food name)
                }

                if (!state.meals[mealName]) {
                    state.meals[mealName] = [];
                }
                state.meals[mealName].push(newItem);
                e.target.reset(); // Clear the form
                await saveData();
            }
        });

        mealContainer.addEventListener('click', async (e) => {
            // Remove Meal Item
            if (e.target.closest('.remove-meal-item-btn')) {
                const button = e.target.closest('.remove-meal-item-btn');
                const mealName = button.dataset.mealName;
                const index = parseInt(button.dataset.index);
                
                if (state.meals[mealName] && state.meals[mealName].length > index) {
                    state.meals[mealName].splice(index, 1);
                    await saveData();
                }
            }
            // Remove Meal Section
            else if (e.target.closest('.remove-meal-section-btn')) {
                const button = e.target.closest('.remove-meal-section-btn');
                const mealName = button.dataset.mealName;

                if (!defaultMeals.includes(mealName) && confirm(`Are you sure you want to delete the "${mealName}" section? This cannot be undone.`)) {
                    delete state.meals[mealName];
                    await saveData();
                } else if (defaultMeals.includes(mealName)) {
                    alert(`The core meal section "${mealName}" cannot be deleted.`);
                }
            }
        });

        // Add Meal Section Modal Logic
        addMealBtn.addEventListener('click', () => {
            addMealModal.classList.remove('hidden');
            mealNameInput.value = '';
        });

        cancelAddMealBtn.addEventListener('click', () => {
            addMealModal.classList.add('hidden');
        });

        confirmAddMealBtn.addEventListener('click', async () => {
            const newMealName = mealNameInput.value.trim();
            if (newMealName && !state.meals[newMealName]) {
                state.meals[newMealName] = [];
                await saveData();
                addMealModal.classList.add('hidden');
            } else if (newMealName) {
                alert('A meal section with this name already exists or is a core section.');
            } else {
                alert('Please enter a name for the new meal section.');
            }
        });
        
    }

</script>
